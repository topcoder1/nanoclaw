name: CI

on:
  pull_request:
    branches: [main]
    # No paths-ignore: 'ci' is a required status check in the main-protection
    # ruleset (added 2026-07-01). A path filter here would leave docs-only PRs
    # stuck at "Expected — waiting for status" forever, since a filtered-out
    # workflow never reports. ~2 min of runner time on docs PRs is the price.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      # Two test files (signer-integration, docusign-executor) launch real
      # Chromium via playwright-core. The package ships without browsers, so
      # without this step those tests fail with "Executable doesn't exist".
      # We use playwright-core's bin (the repo doesn't depend on the full
      # `playwright` meta-package). `--with-deps` pulls system libs needed
      # by Chromium on the ubuntu-latest runner.
      - name: Install Playwright Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Tests
        run: npx vitest run
